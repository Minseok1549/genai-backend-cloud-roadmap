services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: epl_predictions
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - epl_pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 로컬 .env의 DATABASE_URL(localhost 기준)을 컨테이너 네트워크의 db 서비스로 덮어씀
      DATABASE_URL: postgresql://postgres:postgres@db:5432/epl_predictions
    depends_on:
      db:
        condition: service_healthy

volumes:
  epl_pgdata:
